name: Portable RAHM Conformance and Digest Evidence

on:
  push:
    branches: [main]
    paths:
      - 'docs/portable/RAHM/**'
      - 'docs/0.0/anchors/PALANG-0.0-IN-20261024-047-FIRST-LIVING-MASTER.md'
      - 'docs/0.0/anchors/PALANG-0.0-OUT-20261024-046-FIRST-LIVING-MASTER.md'
      - '.github/workflows/rahm-portable-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install jsonschema
      - name: Validate valid and invalid interaction-pair fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          root = Path("docs/portable/RAHM")
          schema = json.loads((root / "INTERACTION_PAIR_SCHEMA.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          valid = json.loads((root / "fixtures/interaction-pair-valid.json").read_text(encoding="utf-8"))
          invalid = json.loads((root / "fixtures/interaction-pair-invalid.json").read_text(encoding="utf-8"))
          valid_errors = list(validator.iter_errors(valid))
          invalid_errors = list(validator.iter_errors(invalid))
          print(f"VALID_FIXTURE_ERRORS={len(valid_errors)}")
          print(f"INVALID_FIXTURE_ERRORS={len(invalid_errors)}")
          assert not valid_errors, [e.message for e in valid_errors]
          assert invalid_errors, "Invalid fixture unexpectedly passed"
          print("SCHEMA_CONFORMANCE=PASS")
          PY
      - name: Recover canonical state independently from IN and OUT
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path(".")
          sources = {
              "IN": root / "docs/0.0/anchors/PALANG-0.0-IN-20261024-047-FIRST-LIVING-MASTER.md",
              "OUT": root / "docs/0.0/anchors/PALANG-0.0-OUT-20261024-046-FIRST-LIVING-MASTER.md",
          }
          expected = {
              "current": "PALANG-0.0-CURRENT-20261024-054-FIRST-LIVING-MASTER.md",
              "next": "PALANG-0.0-NEXT-20261024-048-FIRST-MASTER-CONFORMANCE.md",
              "master": "FIRST-LIVING-MASTER-PORTABLE-GPT6-HAIF.md",
          }
          recovered = {}
          for side, path in sources.items():
              content = path.read_text(encoding="utf-8")
              links = re.findall(r'\]\(([^)]+)\)', content)
              state = {}
              for key, suffix in expected.items():
                  matches = [link for link in links if link.split("#", 1)[0].endswith(suffix)]
                  assert matches, f"{side} recovery missing {key} target {suffix}"
                  state[key] = suffix
              assert "OPEN" in content or "open gates" in content.lower(), f"{side} recovery did not preserve open gates"
              recovered[side] = state
          assert recovered["IN"] == recovered["OUT"], f"IN/OUT recovery mismatch: {recovered}"
          evidence = {"test_id":"RAHM-IN-OUT-RECOVERY-054", "result":"PASS", "recovered_from":"IN-047 and OUT-046 independently", "canonical_state":recovered["IN"], "open_gates_preserved":True, "scope":"Artifact-link and checkpoint recovery equivalence; not a full hidden-memory or independent-host test."}
          Path("rahm-recovery-equivalence.json").write_text(json.dumps(evidence, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2))
          print("IN_OUT_RECOVERY_EQUIVALENCE=PASS")
          PY
      - name: Produce exact-byte SHA-256 evidence for manifest inventory
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path("docs/portable/RAHM/EXPORT_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          base = Path(".")
          results = []
          for entry in manifest["files"]:
              p = base / entry["path"]
              if not p.is_file():
                  results.append({"path": entry["path"], "status": "MISSING"})
                  continue
              data = p.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              expected = entry.get("sha256")
              if not isinstance(expected, str) or len(expected) != 64 or any(ch not in "0123456789abcdef" for ch in expected):
                  results.append({"path": entry["path"], "status": "MISSING_OR_INVALID_EXPECTED_SHA256", "actual_sha256": digest, "expected_sha256": expected})
                  raise SystemExit(f"MISSING_OR_INVALID_EXPECTED_SHA256 {entry['path']}: expected a lowercase 64-character SHA-256")
              if expected != digest:
                  results.append({"path": entry["path"], "status": "MISMATCH", "sha256": digest, "expected_sha256": expected})
                  raise SystemExit(f"SHA256_MISMATCH {entry['path']}: expected {expected} got {digest}")
              results.append({"path": entry["path"], "status": "MATCH", "bytes": len(data), "sha256": digest, "expected_sha256": expected, "git_blob_sha1_recorded": entry.get("git_blob_sha")})
          paths = [entry["path"] for entry in manifest["files"]]
          if len(paths) != len(set(paths)):
              raise SystemExit("DUPLICATE_MANIFEST_PATH")
          output = {"algorithm":"SHA-256 over exact checked-out file bytes", "manifest_path":str(manifest_path), "manifest_version":manifest.get("version"), "manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(), "expected_file_count":len(manifest["files"]), "matched_file_count":sum(1 for x in results if x.get("status") == "MATCH"), "results":results}
          Path("rahm-sha256-evidence.json").write_text(json.dumps(output, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(output, indent=2))
          if len(results) != len(manifest["files"]) or any(x.get("status") != "MATCH" for x in results):
              print("EXACT_BYTE_SHA256_SCAN=FAIL")
              raise SystemExit("MANIFEST_DIGEST_RECONCILIATION_FAILED")
          print("EXACT_BYTE_SHA256_SCAN=PASS")
          PY
      - name: Build extractable RAHM package archive
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          manifest_path = Path("docs/portable/RAHM/EXPORT_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          archive = Path("haif-rahm-portable-package.zip")
          files = [Path(entry["path"]) for entry in manifest["files"]]
          files.append(manifest_path)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for p in files:
                  if not p.is_file():
                      raise SystemExit(f"PACKAGE_FILE_MISSING: {p}")
                  zf.write(p, arcname=str(p))
          print(f"PACKAGE_FILE_COUNT={len(files)}")
          print(f"PACKAGE_BYTES={archive.stat().st_size}")
          print(f"PACKAGE_SHA256={hashlib.sha256(archive.read_bytes()).hexdigest()}")
          print("PORTABLE_PACKAGE_BUILD=PASS")
          PY
      - name: Upload extractable package
        uses: actions/upload-artifact@v4
        with:
          name: haif-rahm-portable-package
          path: haif-rahm-portable-package.zip
      - name: Upload conformance and digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: rahm-portable-conformance-evidence
          path: |
            rahm-sha256-evidence.json
            rahm-recovery-equivalence.json
