name: RAHM Runtime Tests
on:
  pull_request:
    paths:
      - "scripts/rahm-runtime/**"
      - "scripts/haif-runtime/**"
      - "scripts/host-bridge/**"
      - "tests/host-bridge/**"
      - "HOST-BRIDGE/**"
      - ".github/workflows/rahm-runtime-tests.yml"
  push:
    branches:
      - "feat/rahm-haif-live-bridge-mvp-20261123"
    paths:
      - "scripts/rahm-runtime/**"
      - "scripts/haif-runtime/**"
      - ".github/workflows/rahm-runtime-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test HAIF runtime
        run: python -m unittest discover -s scripts/haif-runtime/tests -v
      - name: Test RAHM runtime
        run: python -m unittest discover -s scripts/rahm-runtime/tests -v
      - name: Test host bridge allowlist build
        run: python -m unittest discover -s tests/host-bridge -v
