name: CPREL Independent Transfer Evidence
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime-a:
    runs-on: ubuntu-latest
    steps:
      - name: Runtime A — create claim package
        run: |
          mkdir -p evidence
          node <<'NODE'
          const fs=require('fs');
          const id='CPREL-TRANSFER-TEST-2026-09-02-001';
          const claim={stableIdentity:id, provenancePreserved:true, recoveryObligation:true, retryReconcile:true, verificationRequested:true, originRuntime:'A'};
          if(!Object.values(claim).every(Boolean)) process.exit(1);
          fs.writeFileSync('evidence/claim.json', JSON.stringify(claim,null,2));
          console.log('RUNTIME_A=PASS');
          NODE
      - name: Upload Runtime A evidence
        uses: actions/upload-artifact@v4
        with:
          name: cprel-runtime-a
          path: evidence/claim.json

  runtime-b:
    needs: runtime-a
    runs-on: ubuntu-latest
    steps:
      - name: Download Runtime A claim
        uses: actions/download-artifact@v4
        with:
          name: cprel-runtime-a
          path: input
      - name: Runtime B — independently verify transferred claim
        run: |
          node <<'NODE'
          const fs=require('fs');
          const id='CPREL-TRANSFER-TEST-2026-09-02-001';
          const claim=JSON.parse(fs.readFileSync('input/claim.json','utf8'));
          const pass=claim.stableIdentity===id && claim.provenancePreserved===true && claim.recoveryObligation===true && claim.retryReconcile===true && claim.verificationRequested===true && claim.originRuntime==='A';
          const evidence={testId:id, sourceRuntime:'A', verificationRuntime:'B', execution:'independent-github-actions-runtimes', transferredIdentity:claim.stableIdentity, provenancePreserved:claim.provenancePreserved, observedResult:pass?'PASS':'FAIL', evidenceBoundary:'Two independent CI jobs; proves executable transfer of the registered claim, not generalized cross-platform transfer.'};
          fs.writeFileSync('evidence-result.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          if(!pass) process.exit(1);
          NODE
      - name: Upload independent transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: cprel-independent-transfer-evidence
          path: evidence-result.json
