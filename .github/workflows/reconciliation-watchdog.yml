name: Reconciliation Watchdog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate control-plane artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/PRODUCTION_REGISTRY.md"
            "docs/RECONCILIATION_LEDGER_2026-08-30.md"
            "docs/principles/PRINCIPLE-2026-08-30-001-deferred-registration-automatic-reconciliation.md"
            "docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md"
            "recovery/RECOVERY_BUFFER.md"
            "docs/EVIDENCE_GATE.md"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "CONTROL_PLANE_FAILURE: missing $f"; exit 1; }
          done

      - name: Validate registry contract
        shell: bash
        run: |
          set -euo pipefail
          file="docs/PRODUCTION_REGISTRY.md"
          grep -q "production_id" "$file"
          grep -q "memory_state" "$file"
          grep -q "repository_state" "$file"
          grep -q "evidence_state" "$file"
          grep -q "verification_state" "$file"
          grep -q "reconciliation_state" "$file"
          grep -q "SYNC_GAP" "$file"
          grep -q "Idempotency" "$file"

      - name: Validate no-false-completion controls
        shell: bash
        run: |
          set -euo pipefail
          file="docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md"
          grep -q "No Silent Command Loss" "$file"
          grep -q "No Ambiguous Registration Claim" "$file"
          grep -q "No Evidence → No Completion Claim" "$file"
          grep -q "No Automatic-Reconciliation Claim Without a Proven Mechanism" "$file"

      - name: Emit watchdog evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "RECONCILIATION_WATCHDOG: EXECUTED"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Trigger: $GITHUB_EVENT_NAME"
          echo "Status: CONTROL-PLANE CONTRACT VERIFIED"
