name: Palang Safe Copy 2 Validation

on:
  push:
    branches:
      - palang-safe-copy-2-test-20261126
  pull_request:
    branches:
      - palang-safe-copy-1-baseline-20261126
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-copy-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Confirm main, baseline copy, and execution ref are aligned
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="2c1f9fdc308e34b23be64153e8eec2c30f08a859"
          copy1_branch="palang-safe-copy-1-baseline-20261126"
          copy2_branch="palang-safe-copy-2-test-20261126"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$GITHUB_HEAD_REF" = "$copy2_branch"
          else
            test "$GITHUB_REF" = "refs/heads/$copy2_branch"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/$copy1_branch:refs/remotes/origin/$copy1_branch

          main_sha="$(git rev-parse refs/remotes/origin/main^{commit})"
          copy1_sha="$(git rev-parse refs/remotes/origin/$copy1_branch^{commit})"
          head_sha="$(git rev-parse HEAD^{commit})"

          test "$main_sha" = "$expected"
          test "$copy1_sha" = "$expected"
          test "$head_sha" = "$EXPECTED_HEAD_SHA"

          git merge-base --is-ancestor "$expected" HEAD
          merge_base="$(git merge-base "$expected" HEAD)"
          test "$merge_base" = "$expected"
          commits_ahead="$(git rev-list --count "$expected..HEAD")"
          test "$commits_ahead" -ge 1

          echo "MAIN_UNCHANGED=$main_sha"
          echo "COPY_1_UNCHANGED=$copy1_sha"
          echo "COPY_2_HEAD=$head_sha"
          echo "COPY_2_COMMITS_AHEAD=$commits_ahead"
          echo "BRANCH_ALIGNMENT=PASS"
      - name: Verify only the authorized copy-2 files differ
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/rahm-portable-conformance.yml",
              "prototype/haif-gpt6-starter/test_engine.py",
              "prototype/haif-gpt6-starter/sync_master_version.py",
              "prototype/haif-gpt6-starter/test_sync_master_version.py",
              ".github/workflows/palang-safe-copy2-validation.yml",
              "docs/architecture/SAFE-COPY-GOVERNANCE-CONTRACT-2026-11-26.md",
              "docs/architecture/POINT-0-GOLDEN-INITIAL-MODEL-2026-11-26.md",
              "prototype/haif-gpt6-starter/safe_points_guard.py",
              "prototype/haif-gpt6-starter/test_safe_points_guard.py",
              "prototype/haif-gpt6-starter/safe_copy_audit.py",
              "prototype/haif-gpt6-starter/test_host_entry_sync.py",
              "prototype/haif-gpt6-starter/ONE_MESSAGE_HOST_BOOTSTRAP_FA.md",
              "prototype/universal-host/UNIVERSAL_AI_HOST_ENTRY_FA.md",
              "prototype/haif-gpt6-starter/test_safe_copy_audit.py",
              "prototype/palang-partner/package.json",
              "prototype/palang-partner/server.mjs",
              "prototype/palang-partner/policy.mjs",
              "prototype/palang-partner/policy.test.mjs",
              "prototype/palang-partner/Dockerfile",
              "prototype/palang-partner/README.md",
              "prototype/palang-partner/runtime-smoke.test.mjs",
              "prototype/palang-partner/mcp-protocol.test.mjs",
              "docs/0.0/anchors/PALANG-0.0-NEXT-20261024-051-FULL-GRAPH-TRIAGE-AND-CLEAN-HOST-RECOVERY.md",
              "docs/architecture/SAFE-COPY-GOVERNANCE-CONTRACT-2026-11-26.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/palang-safe-copy-1-baseline-20261126...HEAD"],
              text=True
          ).splitlines())
          print("COPY2_CHANGED_PATHS=", sorted(changed))
          assert changed == expected, {"expected": sorted(expected), "actual": sorted(changed)}
          print("COPY1_TO_COPY2_SCOPE=PASS")
          PY
      - name: Synchronize copy-2 package mother and manifest before tests
        run: python prototype/haif-gpt6-starter/sync_master_version.py --source "docs/architecture/مدل اولیه AI/سند مرجع مادر مدل اولیه هوش مصنوعی.md" --target "prototype/haif-gpt6-starter/LIVING_MASTER_REFERENCE.md" --manifest "prototype/haif-gpt6-starter/manifest.json"
      - name: Compile all starter Python sources
        run: python -m compileall -q prototype/haif-gpt6-starter
      - name: Setup Node.js for Palang Partner MCP
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned MCP runtime dependencies
        working-directory: prototype/palang-partner
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Check MCP runtime and run policy tests
        working-directory: prototype/palang-partner
        run: npm run check && npm test
      - name: Build deployable MCP container
        run: docker build -t palang-partner-mcp:${GITHUB_SHA} prototype/palang-partner
      - name: Audit workflow permissions and recovery package
        run: python prototype/haif-gpt6-starter/safe_copy_audit.py --workflow .github/workflows/palang-safe-copy2-validation.yml --package prototype/haif-gpt6-starter
      - name: Run starter and version-sync tests three times
        working-directory: prototype/haif-gpt6-starter
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "TEST_STRESS_PASS=$pass"
            python -m unittest discover -s . -p 'test*.py' -v
          done
      - name: Whitespace and patch integrity
        run: |
          git diff --check origin/palang-safe-copy-1-baseline-20261126...HEAD
          echo "DIFF_CHECK=PASS"
