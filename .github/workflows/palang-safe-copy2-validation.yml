name: Palang Safe Copy 2 Validation

on:
  push:
    branches:
      - palang-safe-copy-2-workbench-20261127
  pull_request:
    branches:
      - palang-safe-copy-1-baseline-20261126
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-copy-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Verify current golden ancestry and owner-safe scope
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/palang-safe-copy-1-baseline-20261126:refs/remotes/origin/palang-safe-copy-1-baseline-20261126
          main_sha="$(git rev-parse refs/remotes/origin/main^{commit})"
          copy1_sha="$(git rev-parse refs/remotes/origin/palang-safe-copy-1-baseline-20261126^{commit})"
          test "$main_sha" = "$copy1_sha"
          git merge-base --is-ancestor "$main_sha" HEAD
          test "$(git merge-base "$main_sha" HEAD)" = "$main_sha"
          echo "MAIN_AND_COPY1=$main_sha"
          echo "COPY2_HEAD=$EXPECTED_HEAD_SHA"
      - name: Enforce changed-path allowlist
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "README.md",
              "docs/architecture/SAFE-COPY/COPY2-OWNER-COMMAND-CONTROL-PLANE.md",
              ".github/workflows/palang-safe-copy2-validation.yml",
              "prototype/haif-gpt6-starter/safe_copy_audit.py",
              "prototype/haif-gpt6-starter/test_safe_copy_audit.py",
              "prototype/haif-gpt6-starter/safe_points_guard.py",
              "prototype/haif-gpt6-starter/test_safe_points_guard.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/palang-safe-copy-1-baseline-20261126...HEAD"],
              text=True
          ).splitlines())
          print("CHANGED_PATHS=", sorted(changed))
          unexpected = changed - allowed
          assert not unexpected, {"unexpected_paths": sorted(unexpected)}
          print("PATH_ALLOWLIST=PASS")
          PY
      - name: Compile and test Copy 2 guardrails
        run: |
          python -m py_compile prototype/haif-gpt6-starter/safe_copy_audit.py prototype/haif-gpt6-starter/safe_points_guard.py
          cd prototype/haif-gpt6-starter
          python -m unittest -v test_safe_copy_audit.py test_safe_points_guard.py
      - name: Re-run recovery checks from a clean workspace
        shell: bash
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/palang-clean-host-simulation"
          git clone --no-local "$GITHUB_WORKSPACE" "$clean"
          cd "$clean"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile prototype/haif-gpt6-starter/safe_copy_audit.py prototype/haif-gpt6-starter/safe_points_guard.py
          (cd prototype/haif-gpt6-starter && python -m unittest -v test_safe_copy_audit.py test_safe_points_guard.py)
          python prototype/haif-gpt6-starter/safe_copy_audit.py --workflow .github/workflows/palang-safe-copy2-validation.yml --package prototype/haif-gpt6-starter
          echo "CLEAN_WORKSPACE_RECOVERY_SIMULATION=PASS"
          echo "INDEPENDENT_AI_HOST_ACCEPTANCE=NOT_RUN"
      - name: Audit workflow and portable package
        run: python prototype/haif-gpt6-starter/safe_copy_audit.py --workflow .github/workflows/palang-safe-copy2-validation.yml --package prototype/haif-gpt6-starter
      - name: Check patch integrity
        run: git diff --check origin/palang-safe-copy-1-baseline-20261126...HEAD
