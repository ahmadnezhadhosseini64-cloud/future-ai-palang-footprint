name: Pending Registration Drain

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and automatically drain eligible pending records
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/PENDING_REGISTRATION_QUEUE.md
          test -f docs/architecture/DURABLE_PENDING_RECONCILIATION_BRIDGE.md
          test -f recovery/pending/README.md
          grep -q 'Never delete a pending item merely because an attempt failed' recovery/PENDING_REGISTRATION_QUEUE.md
          grep -q 'Every subsequent registration event and scheduled reconciliation must scan this queue' recovery/PENDING_REGISTRATION_QUEUE.md

          changed=0
          shopt -s nullglob
          for pending in recovery/pending/*.md; do
            [ "$(basename "$pending")" = "README.md" ] && continue
            approval=$(grep -m1 '^approval:' "$pending" | cut -d: -f2- | xargs || true)
            status=$(grep -m1 '^status:' "$pending" | cut -d: -f2- | xargs || true)
            auto=$(grep -m1 '^auto_finalize:' "$pending" | cut -d: -f2- | xargs || true)
            production_id=$(grep -m1 '^production_id:' "$pending" | cut -d: -f2- | xargs || true)
            destination=$(grep -m1 '^canonical_destination:' "$pending" | cut -d: -f2- | xargs || true)

            if [ "$approval" != "APPROVED" ] || [ "$status" != "ELIGIBLE" ] || [ "$auto" != "true" ]; then
              echo "PENDING_RETAINED file=$pending production_id=$production_id reason=eligibility-gate"
              continue
            fi
            case "$destination" in
              docs/*.md) ;;
              *) echo "PENDING_RETAINED file=$pending production_id=$production_id reason=invalid-destination"; continue ;;
            esac
            test -n "$production_id"
            test -n "$destination"
            test -f "$pending"

            payload=$(mktemp)
            awk 'found {print} /^---PAYLOAD---$/ {found=1; next}' "$pending" > "$payload"
            test -s "$payload"

            if [ -f "$destination" ]; then
              grep -Fq -- "$production_id" "$destination" || { echo "PENDING_CONFLICT production_id=$production_id destination=$destination"; rm -f "$payload"; continue; }
              echo "RECONCILED_EXISTING production_id=$production_id destination=$destination"
            else
              cp "$payload" "$destination"
              grep -Fq -- "$production_id" "$destination" || { echo "VERIFY_FAILED production_id=$production_id"; rm -f "$payload"; exit 1; }
              echo "REGISTERED_AND_READ_BACK production_id=$production_id destination=$destination"
            fi

            sed -i 's/^status: .*/status: RECONCILED/' "$pending"
            printf '\nreconciled_at: %s\nreconciled_by: pending-registration-drain\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$pending"
            changed=1
            rm -f "$payload"
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recovery/pending docs
            git commit -m "Automatically reconcile eligible pending registrations"
            git push
          else
            echo "NO_ELIGIBLE_PENDING_RECORDS"
          fi
          echo "PENDING_DRAIN=EXECUTABLE"
          echo "IDEMPOTENCY=ENFORCED"
          echo "EXECUTION_CLAIM_INTEGRITY=ENFORCED"
