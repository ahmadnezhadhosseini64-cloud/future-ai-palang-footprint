name: Pending Registration Audit — Read Only

on:
  push:
    branches: [main]
    paths:
      - "recovery/PENDING_REGISTRATION_QUEUE.md"
      - "recovery/pending/**"
      - "docs/architecture/DURABLE_PENDING_RECONCILIATION_BRIDGE.md"
      - ".github/workflows/pending-registration-drain.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pending-registration-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Audit pending records without mutating canonical files
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/PENDING_REGISTRATION_QUEUE.md
          test -f docs/architecture/DURABLE_PENDING_RECONCILIATION_BRIDGE.md
          test -f recovery/pending/README.md
          grep -q 'Never delete a pending item merely because an attempt failed' recovery/PENDING_REGISTRATION_QUEUE.md
          grep -q 'Every subsequent registration event and scheduled reconciliation must scan this queue' recovery/PENDING_REGISTRATION_QUEUE.md
          mkdir -p artifacts/pending-registration
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          rows = []
          for path in sorted(Path("recovery/pending").glob("*.md")):
              if path.name == "README.md":
                  continue
              text = path.read_text(encoding="utf-8")
              fields = {}
              for key in ("approval", "status", "auto_finalize", "production_id", "canonical_destination"):
                  match = re.search(rf"^{key}:\s*(.*?)\s*$", text, re.MULTILINE)
                  fields[key] = match.group(1).strip() if match else ""
              destination = fields["canonical_destination"]
              safe_destination = (
                  destination.startswith("docs/")
                  and destination.endswith(".md")
                  and ".." not in Path(destination).parts
                  and not Path(destination).is_absolute()
              )
              eligible = (
                  fields["approval"] == "APPROVED"
                  and fields["status"] == "ELIGIBLE"
                  and fields["auto_finalize"] == "true"
                  and bool(fields["production_id"])
                  and safe_destination
                  and "---PAYLOAD---" in text
                  and bool(text.split("---PAYLOAD---", 1)[1].strip())
              )
              rows.append({
                  "file": str(path),
                  "production_id": fields["production_id"],
                  "status": "ELIGIBLE_FOR_OWNER_REVIEW_PR" if eligible else "RETAINED_OPEN",
                  "canonical_destination": destination,
                  "reason": "eligibility-and-destination-check-passed" if eligible else "one-or-more-gates-not-satisfied",
              })
          report = {
              "mode": "READ_ONLY_AUDIT",
              "master_mutated": False,
              "automatic_promotion": False,
              "records_scanned": len(rows),
              "eligible_for_owner_review_pr": sum(r["status"] == "ELIGIBLE_FOR_OWNER_REVIEW_PR" for r in rows),
              "records": rows,
          }
          Path("artifacts/pending-registration/report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          echo "PENDING_QUEUE_AUDIT=PASS"
          echo "MASTER_WRITE=DISABLED"
          echo "AUTOMATIC_PROMOTION=DISABLED"
      - name: Upload read-only audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pending-registration-audit-\${{ github.run_id }}
          path: artifacts/pending-registration/report.json
          if-no-files-found: error
          retention-days: 90
