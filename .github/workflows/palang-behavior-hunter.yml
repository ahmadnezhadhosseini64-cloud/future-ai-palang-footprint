name: Palang Behavior Hunter — Candidate Test Generation
on:
  push:
    branches: ["main"]
    paths:
      - "data/interaction-pairs/**"
      - "docs/architecture/BEHAVIOR-TRACE/**"
      - "docs/reference/REFERENCE-DOCUMENTS/**"
      - "scripts/behavior-hunter/**"
      - "docs/architecture/BEHAVIOR-OBSERVATORY/**"
      - "tests/behavior-hunter/**"
      - ".github/workflows/palang-behavior-hunter.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run generator unit tests
        run: python -m unittest discover -s tests/behavior-hunter -v
      - name: Generate candidate test manifest
        run: python scripts/behavior-hunter/generate_candidate_tests.py --input data/interaction-pairs/interaction-pairs.jsonl --output artifacts/behavior-hunter/candidate-tests.json
      - name: Generate architecture insight candidates from explicit outcome records
        run: python scripts/behavior-hunter/extract_architecture_insights.py --input data/interaction-pairs/test-outcomes.jsonl --output artifacts/behavior-hunter/architecture-insights.json
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: palang-behavior-hunter-evidence-manifests
          path: artifacts/behavior-hunter/*.json
          if-no-files-found: error
