name: Palang Behavior Hunter — Candidate Test Generation
on:
  push:
    branches: ["main"]
    paths:
      - "data/interaction-pairs/**"
      - "docs/architecture/BEHAVIOR-TRACE/**"
      - "docs/reference/REFERENCE-DOCUMENTS/**"
      - "scripts/behavior-hunter/**"
      - "docs/architecture/BEHAVIOR-OBSERVATORY/**"
      - "tests/behavior-hunter/**"
      - "docs/0.0/**"
      - "docs/architecture/INTEGRATION-QUEUE/**"
      - ".github/workflows/palang-behavior-hunter.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run generator unit tests
        run: python -m unittest discover -s tests/behavior-hunter -v
      - name: Recover interaction graph starting from IN anchor
        run: python scripts/behavior-hunter/recover_interaction_graph.py --start IN --output artifacts/behavior-hunter/recovery-from-IN.json
      - name: Recover interaction graph starting from OUT anchor
        run: python scripts/behavior-hunter/recover_interaction_graph.py --start OUT --output artifacts/behavior-hunter/recovery-from-OUT.json
      - name: Detect drift across the living architecture graph
        run: python scripts/behavior-hunter/check_living_graph_drift.py --output artifacts/behavior-hunter/living-graph-drift.json
      - name: Validate append-only architecture evolution ledger
        run: python scripts/behavior-hunter/validate_architecture_update_ledger.py --input data/interaction-pairs/architecture-update-ledger.jsonl --output artifacts/behavior-hunter/architecture-update-ledger.json
      - name: Validate architecture update proposal and preserve owner gate
        run: python scripts/behavior-hunter/architecture_update_gate.py --input data/interaction-pairs/architecture-update-proposal-fixture.json --output artifacts/behavior-hunter/architecture-update-gate.json
      - name: Generate candidate test manifest
        run: python scripts/behavior-hunter/generate_candidate_tests.py --input data/interaction-pairs/interaction-pairs.jsonl --output artifacts/behavior-hunter/candidate-tests.json
      - name: Generate architecture insight candidates from explicit outcome records
        run: python scripts/behavior-hunter/extract_architecture_insights.py --source-mode fixture --input data/interaction-pairs/test-outcomes.jsonl --output artifacts/behavior-hunter/architecture-insights.json
      - name: Resolve one controlled non-fixture repository evidence locator
        run: python scripts/behavior-hunter/resolve_evidence_locators.py --source-mode production --input data/interaction-pairs/evidence-resolution-production-smoke.jsonl --output artifacts/behavior-hunter/evidence-resolution-production-smoke.json
      - name: Resolve evidence locators from explicit outcome records
        run: python scripts/behavior-hunter/resolve_evidence_locators.py --source-mode fixture --input data/interaction-pairs/test-outcomes.jsonl --output artifacts/behavior-hunter/evidence-resolution.json
      - name: Emit terminal status receipt even when prior checks fail
        if: always()
        run: |
          python scripts/behavior-hunter/emit_status_receipt.py \
            --event-id EVT-0131 \
            --pair-id INT-20261024-033 \
            --stage CI_TERMINAL \
            --status "${{ job.status }}" \
            --run-id "${{ github.run_id }}" \
            --tested-sha "${{ github.sha }}" \
            --next-action "Inspect all manifests; verify current-main versus tested SHA; keep fresh-session recovery separate." \
            --output artifacts/behavior-hunter/status-receipt.json
      - name: Upload generated manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palang-behavior-hunter-evidence-manifests
          path: artifacts/behavior-hunter/*.json
          if-no-files-found: error
