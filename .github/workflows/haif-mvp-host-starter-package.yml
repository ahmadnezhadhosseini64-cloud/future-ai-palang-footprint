name: HAIF MVP Host Starter Package

on:
  push:
    branches:
      - mvp-single-core-archive-haif-v0-20261123
    paths:
      - "prototype/haif-mvp-starter/**"
      - "scripts/haif-runtime/**"
      - "docs/architecture/HAIF-MVP-CANONICAL-IMPLEMENTATION-DECISION-2026-11-23.md"
      - "docs/architecture/HAIF-MVP-OPEN-WORK-CHECKLIST.md"
      - ".github/workflows/haif-mvp-host-starter-package.yml"
  pull_request:
    paths:
      - "prototype/haif-mvp-starter/**"
      - "scripts/haif-runtime/**"
      - "docs/architecture/HAIF-MVP-CANONICAL-IMPLEMENTATION-DECISION-2026-11-23.md"
      - "docs/architecture/HAIF-MVP-OPEN-WORK-CHECKLIST.md"
      - ".github/workflows/haif-mvp-host-starter-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run MVP runtime tests
        run: python -m unittest discover -s scripts/haif-runtime/tests -v
      - name: Smoke-test runtime CLI
        run: python scripts/haif-runtime/haif_runtime.py --help
      - name: Assemble portable package
        run: |
          mkdir -p dist/haif-mvp-host-starter
          cp -R prototype/haif-mvp-starter/. dist/haif-mvp-host-starter/
          mkdir -p dist/haif-mvp-host-starter/runtime
          cp scripts/haif-runtime/README.md scripts/haif-runtime/haif_runtime.py dist/haif-mvp-host-starter/runtime/
          mkdir -p dist/haif-mvp-host-starter/runtime/tests
          cp scripts/haif-runtime/tests/test_runtime.py dist/haif-mvp-host-starter/runtime/tests/
          mkdir -p dist/haif-mvp-host-starter/architecture
          cp docs/architecture/HAIF-MVP-CANONICAL-IMPLEMENTATION-DECISION-2026-11-23.md dist/haif-mvp-host-starter/architecture/
          cp docs/architecture/HAIF-MVP-OPEN-WORK-CHECKLIST.md dist/haif-mvp-host-starter/architecture/
          cd dist
          zip -qr haif-mvp-host-starter-v0.1.0-candidate.zip haif-mvp-host-starter
          sha256sum haif-mvp-host-starter-v0.1.0-candidate.zip | tee SHA256SUMS.txt
          find haif-mvp-host-starter -type f -print | sort | tee INVENTORY.txt
      - name: Upload portable ZIP and receipts
        uses: actions/upload-artifact@v4
        with:
          name: haif-mvp-host-starter-v0.1.0-candidate
          path: |
            dist/haif-mvp-host-starter-v0.1.0-candidate.zip
            dist/SHA256SUMS.txt
            dist/INVENTORY.txt
          if-no-files-found: error
          retention-days: 30
