name: Universal AI Host Contract Tests

on:
  pull_request:
    paths:
      - "docs/architecture/UNIVERSAL-AI-HOST-CONNECTIVITY/**"
      - "prototype/universal-ai-host/**"
      - ".github/workflows/universal-ai-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-host-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate JSON Schema syntax
        run: python -m json.tool docs/architecture/UNIVERSAL-AI-HOST-CONNECTIVITY/host-capability-receipt.schema.json > /dev/null
      - name: Compile validator
        run: python -m py_compile prototype/universal-ai-host/host_receipt.py
      - name: Run receipt validator tests
        run: python -m unittest discover -s prototype/universal-ai-host/tests -v
