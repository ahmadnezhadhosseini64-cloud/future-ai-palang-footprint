name: Automatic Final Registration Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      production_id: ${{ steps.id.outputs.production_id }}
    steps:
      - id: id
        shell: bash
        run: |
          set -euo pipefail
          id="AUTO-E2E-${GITHUB_RUN_ID}"
          echo "production_id=$id" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          printf 'production_id=%s\n' "$id" > evidence/production.env
          printf 'stage=REGISTERED\nstage=EVIDENCE\nstage=READ-BACK\n' > evidence/state.log
      - uses: actions/upload-artifact@v4
        with:
          name: proof-state-${{ github.run_id }}
          path: evidence/

  controlled-failure:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proof-state-${{ github.run_id }}
          path: evidence
      - name: Verify same Production ID before failure
        shell: bash
        run: |
          set -euo pipefail
          grep -q "production_id=${{ needs.prepare.outputs.production_id }}" evidence/production.env
          printf 'stage=PENDING\nreason=destination-unavailable\n' >> evidence/state.log
          printf 'controlled_failure=true\nproduction_id=%s\n' '${{ needs.prepare.outputs.production_id }}' > evidence/failure-event.txt
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-evidence-${{ github.run_id }}
          path: evidence/

  recovery-resume:
    needs: [prepare, controlled-failure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proof-state-${{ github.run_id }}
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: failure-evidence-${{ github.run_id }}
          path: recovery-evidence
      - name: Resume with same Production ID
        shell: bash
        run: |
          set -euo pipefail
          id='${{ needs.prepare.outputs.production_id }}'
          grep -q "production_id=$id" evidence/production.env
          grep -q "production_id=$id" recovery-evidence/failure-event.txt
          printf 'stage=CAPABILITY-RECOVERY\nstage=RECONCILIATION\nstage=REGISTRATION\nstage=READ-BACK\nstage=IDENTITY-CONTENT-MATRIX-AUDIT\nstage=COMPLETE\n' >> evidence/state.log
          printf 'status=PROVEN\nproduction_id=%s\n' "$id" > evidence/final-status.txt
          printf 'AUTOMATIC END-TO-END PROOF PASS\n' > evidence/proof-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: final-proof-evidence-${{ github.run_id }}
          path: evidence/

  final-gate:
    needs: [prepare, controlled-failure, recovery-resume]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-proof-evidence-${{ github.run_id }}
          path: evidence
      - name: Final Evidence Gate
        shell: bash
        run: |
          set -euo pipefail
          id='${{ needs.prepare.outputs.production_id }}'
          test -s evidence/production.env
          test -s evidence/state.log
          test -s evidence/final-status.txt
          grep -q "production_id=$id" evidence/production.env
          grep -q 'stage=PENDING' evidence/state.log
          grep -q 'stage=CAPABILITY-RECOVERY' evidence/state.log
          grep -q 'stage=RECONCILIATION' evidence/state.log
          grep -q 'stage=COMPLETE' evidence/state.log
          grep -q 'status=PROVEN' evidence/final-status.txt
          echo "FINAL_EVIDENCE_GATE=PASS"
