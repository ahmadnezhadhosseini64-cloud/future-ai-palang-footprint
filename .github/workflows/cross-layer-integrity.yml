name: Cross-Layer Integrity Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required control artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/RECONCILIATION_LEDGER_2026-08-30.md"
            "docs/principles/PRINCIPLE-2026-08-30-001-deferred-registration-automatic-reconciliation.md"
            "docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md"
            "docs/RECOVERY_ARCHITECTURE.md"
            "docs/EVIDENCE_GATE.md"
            "docs/STABLE_RETRIEVAL_CORE.md"
            "docs/RETRIEVAL_RUNTIME.md"
            "recovery/RECOVERY_BUFFER.md"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING REQUIRED ARTIFACT: $f"; exit 1; }
          done

      - name: Validate non-ambiguous completion rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "No Silent Command Loss" docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md
          grep -q "No Ambiguous Registration Claim" docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md
          grep -q "No Evidence → No Completion Claim" docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md
          grep -q "PENDING" docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md
          grep -q "SYNC_GAP" docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md

      - name: Validate mandatory project metadata in the active control principle
        shell: bash
        run: |
          set -euo pipefail
          file="docs/principles/PRINCIPLE-2026-08-30-002-cross-layer-command-completion-integrity.md"
          for field in "Project:" "Owner:" "Location:" "Date:" "Status:"; do
            grep -q "$field" "$file" || { echo "MISSING METADATA: $field"; exit 1; }
          done

      - name: Execute PMA cross-layer relationship assertions
        shell: bash
        run: |
          set -euo pipefail
          master="checkpoints/CURRENT-0.0-MASTER-REFERENCE-2026-08-31.md"
          testdoc="docs/evidence/CROSS-LAYER-PMA-RELATIONSHIP-TEST-2026-09-03.md"
          pma="architecture/memory/PERSISTENT-MEMORY-ADAPTER-SPEC-2026-09-01.md"
          bridge="adapters/pma/runtime/pma_runtime_bridge.py"
          ext="docs/evidence/EXTERNAL-MEMORY-BRIDGE-EVIDENCE-TEST-2026-09-01.md"

          for f in "$master" "$testdoc" "$pma" "$bridge" "$ext"; do
            test -f "$f" || { echo "MISSING PMA CROSS-LAYER ARTIFACT: $f"; exit 1; }
          done

          grep -q "EXC-REV-2026-09-03-001" "$master"
          grep -q "PMA-2026-09-01-001" "$master"
          grep -q "MPGG-2026-09-01-001" "$master"
          grep -q "XLR-PMA-2026-09-03-001" "$testdoc"
          grep -q "PMA-2026-09-01-001" "$testdoc"
          grep -q "MPGG-2026-09-01-001" "$testdoc"
          grep -q "UNVERIFIED / PENDING" "$master"
          grep -q "provider-level" "$testdoc"
          grep -q "independent READ-BACK" "$testdoc"

          echo "PMA Cross-Layer Relationship: PASS"
          echo "Production ID: XLR-PMA-2026-09-03-001"
          echo "PMA: PMA-2026-09-01-001"
          echo "External-memory anchor: MPGG-2026-09-01-001"
          echo "External Persistent Memory provider verification: PENDING"

      - name: Emit traceable execution evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "Cross-Layer Integrity Gate: EXECUTED"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Status: CONTROL ARTIFACTS VERIFIED"
