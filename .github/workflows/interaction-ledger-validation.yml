name: Interaction ledger validation and recovery

on:
  push:
    paths:
      - 'docs/architecture/BEHAVIOR-TRACE/interaction-pair-ledger.schema.json'
      - 'docs/architecture/BEHAVIOR-TRACE/fixtures/**'
      - '.github/workflows/interaction-ledger-validation.yml'
  pull_request:
    paths:
      - 'docs/architecture/BEHAVIOR-TRACE/interaction-pair-ledger.schema.json'
      - 'docs/architecture/BEHAVIOR-TRACE/fixtures/**'
      - '.github/workflows/interaction-ledger-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema
      - name: Validate schema and synthetic record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("docs/architecture/BEHAVIOR-TRACE/interaction-pair-ledger.schema.json").read_text(encoding="utf-8"))
          record = json.loads(Path("docs/architecture/BEHAVIOR-TRACE/fixtures/interaction-pair-ledger-smoke-test.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(record), key=lambda e: list(map(str, e.path)))
          if errors:
              for error in errors:
                  print(f"SCHEMA ERROR at {list(error.path)}: {error.message}")
              raise SystemExit(1)
          assert record["input_id"] == "IN-20261022-001"
          assert record["output_id"] == "OUT-20261022-001"
          assert record["interaction_id"] == "INT-20261022-001"
          print("PASS: Draft 2020-12 schema meta-validation, fixture validation, and pair identity.")
          PY

  recover-from-input:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout for input-side recovery
        uses: actions/checkout@v4
      - name: Recover pair and lineage using IN ID
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("docs/architecture/BEHAVIOR-TRACE/fixtures/interaction-pair-ledger-smoke-test.json").read_text(encoding="utf-8"))
          requested = "IN-20261022-001"
          index = {record["input_id"]: record}
          recovered = index.get(requested)
          assert recovered is not None
          assert recovered["interaction_id"] == "INT-20261022-001"
          assert recovered["output_id"] == "OUT-20261022-001"
          assert recovered["lineage"]["related_event_ids"]
          assert recovered["lineage"]["architecture_refs"]
          assert recovered["lineage"]["evidence_refs"]
          print("PASS: fresh-checkout recovery from input ID and lineage.")
          PY

  recover-from-output:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout for output-side recovery
        uses: actions/checkout@v4
      - name: Recover pair and lineage using OUT ID
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("docs/architecture/BEHAVIOR-TRACE/fixtures/interaction-pair-ledger-smoke-test.json").read_text(encoding="utf-8"))
          requested = "OUT-20261022-001"
          index = {record["output_id"]: record}
          recovered = index.get(requested)
          assert recovered is not None
          assert recovered["interaction_id"] == "INT-20261022-001"
          assert recovered["input_id"] == "IN-20261022-001"
          assert recovered["lineage"]["related_event_ids"]
          assert recovered["lineage"]["architecture_refs"]
          assert recovered["lineage"]["evidence_refs"]
          print("PASS: fresh-checkout recovery from output ID and lineage.")
          PY
