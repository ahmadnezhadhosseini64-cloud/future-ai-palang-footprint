name: HAIF Canonical MVP Runtime Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/haif-runtime/**"
      - ".github/workflows/haif-prototype-tests.yml"
  pull_request:
    paths:
      - "scripts/haif-runtime/**"
      - ".github/workflows/haif-prototype-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-haif-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run dependency-free runtime tests
        run: python -m unittest discover -s scripts/haif-runtime/tests -v
      - name: Smoke-test CLI help
        run: python scripts/haif-runtime/haif_runtime.py --help
