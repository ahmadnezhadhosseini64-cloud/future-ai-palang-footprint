name: Networked Safe Base Succession Tests

on:
  pull_request:
  push:
    branches: ["architecture/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposal
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run legacy succession policy tests
        run: python -m unittest discover -s tests/architecture -p "test_safe_base_succession.py" -v
      - name: Run fail-closed safe-point resolver tests
        run: python -m unittest discover -s tests/architecture -p "test_safe_base_resolver.py" -v
      - name: Run two-stage host intake gate tests
        run: python -m unittest discover -s tests/architecture -p "test_host_intake_gate.py" -v
      - name: Run deterministic ZIP builder tests
        run: python -m unittest discover -s tests/architecture -p "test_canonical_zip.py" -v
      - name: Run complete architecture test suite
        run: python -m unittest discover -s tests/architecture -p "test_*.py" -v
      - name: Verify proposal links and single-root constraints
        shell: bash
        run: |
          set -euo pipefail
          grep -q "HAIF-SAFE-BASE-NETWORKED-SUCCESSION-2026-11-25-001" "docs/architecture/contracts/NETWORKED-SAFE-BASE-AND-VERIFIED-SUCCESSION-2026-11-25-001.md"
          grep -q "POINT-0/GOLDEN" "docs/architecture/contracts/NETWORKED-SAFE-BASE-AND-VERIFIED-SUCCESSION-2026-11-25-001.md"
          grep -q "NEXT-051" "docs/architecture/contracts/NETWORKED-SAFE-BASE-AND-VERIFIED-SUCCESSION-2026-11-25-001.md"
          grep -q "2c1f9fdc308e34b23be64153e8eec2c30f08a859" "docs/architecture/contracts/NETWORKED-SAFE-BASE-AND-VERIFIED-SUCCESSION-2026-11-25-001.md"
          echo "SAFE_BASE_SUCCESSION_POLICY=PASS"
