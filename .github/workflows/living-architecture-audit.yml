name: Living Architecture Audit
# Point-0 continuity gate: required files and cross-surface links are audited in this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-architecture-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce automatic interaction registration contract links
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/architecture/GOVERNANCE/AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0073-AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/architecture/GOVERNANCE/ASSISTANT-TIMESTAMP-ANCHOR-STANDARD-2026-10-21-001.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/reference/REFERENCE-DOCUMENTS/PERMANENT-INTERACTION-ANCHORING-TIMESTAMP-GOVERNANCE-AND-CANONICAL-GRAPH-MASTER-REFERENCE-2026-10-21-001.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/REFERENCE_INDEX.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' 'docs/architecture/مدل اولیه AI/سند مرجع مادر مدل اولیه هوش مصنوعی.md'
          grep -q 'OPEN / NOT PROVEN' docs/architecture/GOVERNANCE/AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001.md
          echo "AUTOMATIC_INTERACTION_REGISTRATION_POLICY=PASS"
          echo "LIVE_MESSAGE_CAPTURE=OPEN_NOT_PROVEN"
          echo "Note: this gate checks repository policy integration only; it does not capture live ChatGPT messages."

      - name: Enforce universal living component governance graph
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/reference/REFERENCE-DOCUMENTS/UNIVERSAL-LIVING-COMPONENT-GOVERNANCE-MASTER-REFERENCE-2026-10-23-001.md
          test -f docs/architecture/ARCHITECTURE-LESSONS/SOURCE-RULE-COMPONENT-TEST-MAP-2026-10-23-001.md
          test -f docs/architecture/ARCHITECTURE-LESSONS/HISTORIC-LESSON-MIGRATION-LEDGER-2026-10-23-001.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0110-UNIVERSAL-LIVING-COMPONENT-GOVERNANCE-2026-10-23.md
          test -f docs/architecture/ARCHITECTURE-LESSONS/lessons/LAL-20261023-008-UNIVERSAL-LIVING-COMPONENT-GOVERNANCE.md
          test -f docs/0.0/anchors/PALANG-0.0-IN-20261023-021-UNIVERSAL-LIVING-COMPONENT-GOVERNANCE.md
          test -f docs/0.0/anchors/PALANG-0.0-OUT-20261023-021-UNIVERSAL-LIVING-COMPONENT-GOVERNANCE.md
          test -f docs/0.0/anchors/PALANG-0.0-NEXT-20261023-022-HISTORIC-SOURCE-GRAPH-EXCAVATION.md
          grep -q 'SRCMAP-2026-10-23-001' docs/reference/REFERENCE-DOCUMENTS/UNIVERSAL-LIVING-COMPONENT-GOVERNANCE-MASTER-REFERENCE-2026-10-23-001.md
          grep -q 'SRCMAP-2026-10-23-001' docs/REFERENCE_INDEX.md
          grep -q 'SRCMAP-2026-10-23-001' docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'SRCMAP-2026-10-23-001' docs/architecture/ARCHITECTURE-LESSONS/README.md
          grep -q 'Issue #21' docs/architecture/ARCHITECTURE-LESSONS/HISTORIC-LESSON-MIGRATION-LEDGER-2026-10-23-001.md
          grep -q 'Issue #20' docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'Issue #21' docs/architecture/INTEGRATION-QUEUE/README.md
          echo "ULCG_SOURCE_GRAPH_GATE=PASS"
          echo "ULCG_RUNTIME_AUTOCAPTURE=NOT_PROVEN"

      - name: Enforce current point 0 and next 0.0 continuity graph
        shell: bash
        run: |
          set -euo pipefail
          test -f checkpoints/PALANG-0.0-CURRENT-2026-10-20-001.md
          grep -q 'CURRENT-023' checkpoints/PALANG-0.0-CURRENT-2026-10-20-001.md
          grep -q 'NEXT-024' checkpoints/PALANG-0.0-CURRENT-2026-10-20-001.md
          test -f docs/0.0/anchors/PALANG-0.0-CURRENT-20261023-023-USER-CHECKPOINT-AND-CONTINUATION.md
          test -f docs/0.0/anchors/PALANG-0.0-NEXT-20261023-024-CONTINUITY-HISTORIC-AND-COLD-START.md
          test -f docs/0.0/anchors/PALANG-0.0-IN-20261023-023-REGISTER-CURRENT-POINT-0.md
          test -f docs/0.0/anchors/PALANG-0.0-OUT-20261023-023-REGISTER-CURRENT-POINT-0.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0112-CURRENT-POINT-0-AND-NEXT-0.0-2026-10-23.md
          test -f docs/architecture/ARCHITECTURE-LESSONS/lessons/LAL-20261023-010-CURRENT-POINT-AND-NEXT-CHECKPOINT.md
          test -f docs/architecture/BEHAVIOR-TRACE/TIME-BINDING-INT-20261023-023.md
          grep -q 'CURRENT-023' docs/reference/REFERENCE-DOCUMENTS/UNIVERSAL-LIVING-COMPONENT-GOVERNANCE-MASTER-REFERENCE-2026-10-23-001.md
          grep -q 'NEXT-024' docs/reference/REFERENCE-DOCUMENTS/UNIVERSAL-LIVING-COMPONENT-GOVERNANCE-MASTER-REFERENCE-2026-10-23-001.md
          grep -q 'EVT-0112' docs/REFERENCE_INDEX.md
          grep -q 'NEXT-024' docs/0.0/README.md
          grep -q 'Issue #21' docs/0.0/anchors/PALANG-0.0-NEXT-20261023-024-CONTINUITY-HISTORIC-AND-COLD-START.md
          grep -q 'Issue #20' docs/0.0/anchors/PALANG-0.0-NEXT-20261023-024-CONTINUITY-HISTORIC-AND-COLD-START.md
          echo "CURRENT_POINT_0_NEXT_0_0_CONTINUITY=PASS"
          echo "HISTORIC_CENSUS_AND_COLD_START_REMAIN_OPEN=true"
          echo "RUNTIME_AUTOCAPTURE_PROVEN=false"

      - name: Preserve historical Point 0/006 baseline without treating it as the current pointer
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/0.0/anchors/GPT6-RAHM-USER-POINT-0-20261024-006-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          test -f docs/0.0/anchors/PALANG-0.0-IN-20261024-050-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          test -f docs/0.0/anchors/PALANG-0.0-OUT-20261024-049-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0159-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY-2026-10-24.md
          test -f docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-056-OUTPUT-CONTINUITY-AND-RECOVERY.md
          test -f docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-057-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          test -f docs/0.0/anchors/PALANG-0.0-NEXT-20261024-051-FULL-GRAPH-TRIAGE-AND-CLEAN-HOST-RECOVERY.md
          test -f docs/portable/RAHM/FIRST-LIVING-MASTER-PORTABLE-GPT6-HAIF.md
          test -f docs/portable/RAHM/EXPORT_MANIFEST.json
          test -f docs/REFERENCE_INDEX.md
          test -f docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'G6IP-RAHM-USER-POINT-0-20261024-006' docs/0.0/anchors/GPT6-RAHM-USER-POINT-0-20261024-006-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          grep -q 'G6IP-RAHM-IN-050-20261024' docs/0.0/anchors/PALANG-0.0-IN-20261024-050-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          grep -q 'G6IP-RAHM-OUT-049-20261024' docs/0.0/anchors/PALANG-0.0-OUT-20261024-049-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          grep -q 'G6IP-RAHM-EVT-0159-20261024' docs/architecture/BEHAVIOR-TRACE/EVT-0159-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY-2026-10-24.md
          grep -q 'G6IP-RAHM-CURRENT-057-20261024' docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-057-REPOSITORY-EXCAVATION-AND-LIVING-RECOVERY.md
          grep -q 'G6IP-RAHM-NEXT-051-20261024' docs/0.0/anchors/PALANG-0.0-NEXT-20261024-051-FULL-GRAPH-TRIAGE-AND-CLEAN-HOST-RECOVERY.md
          grep -q 'NEXT-051' docs/portable/RAHM/FIRST-LIVING-MASTER-PORTABLE-GPT6-HAIF.md
          echo "HISTORICAL_POINT_0_006_BASELINE_FILES_AND_IDS=PASS"
          echo "REAL_HOST_IMPORT_AND_FULL_STATE_RECOVERY=OPEN"
          echo "PERSISTENCE_AND_IDLE_BACKGROUND=NOT_VERIFIED"

      - name: Enforce latest Point 0/007 to CURRENT-058 with NEXT-051 retained
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/0.0/anchors/GPT6-RAHM-USER-POINT-0-20261024-007-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          test -f docs/0.0/anchors/PALANG-0.0-IN-20261024-051-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          test -f docs/0.0/anchors/PALANG-0.0-OUT-20261024-050-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0160-DEEP-EXCAVATION-EXECUTION-RECEIPTS-AND-AUDIT-CORRECTION-2026-10-24.md
          test -f docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-058-DEEP-EXCAVATION-EXECUTION-RECEIPTS.md
          test -f docs/0.0/anchors/PALANG-0.0-NEXT-20261024-051-FULL-GRAPH-TRIAGE-AND-CLEAN-HOST-RECOVERY.md
          grep -q 'G6IP-RAHM-USER-POINT-0-20261024-007' docs/0.0/anchors/GPT6-RAHM-USER-POINT-0-20261024-007-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          grep -q 'G6IP-RAHM-IN-051-20261024' docs/0.0/anchors/PALANG-0.0-IN-20261024-051-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          grep -q 'G6IP-RAHM-OUT-050-20261024' docs/0.0/anchors/PALANG-0.0-OUT-20261024-050-DEEP-EXCAVATION-AND-EXECUTION-RECEIPTS.md
          grep -q 'G6IP-RAHM-EVT-0160-20261024' docs/architecture/BEHAVIOR-TRACE/EVT-0160-DEEP-EXCAVATION-EXECUTION-RECEIPTS-AND-AUDIT-CORRECTION-2026-10-24.md
          grep -q 'G6IP-RAHM-CURRENT-058-20261024' docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-058-DEEP-EXCAVATION-EXECUTION-RECEIPTS.md
          grep -q 'NEXT-051' docs/0.0/anchors/PALANG-0.0-CURRENT-20261024-058-DEEP-EXCAVATION-EXECUTION-RECEIPTS.md
          grep -q 'CURRENT-058' docs/portable/RAHM/FIRST-LIVING-MASTER-PORTABLE-GPT6-HAIF.md
          grep -q 'CURRENT-058' docs/REFERENCE_INDEX.md
          grep -q 'CURRENT-058' docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'OPEN / LIVING' docs/0.0/anchors/PALANG-0.0-NEXT-20261024-051-FULL-GRAPH-TRIAGE-AND-CLEAN-HOST-RECOVERY.md
          echo "CURRENT_POINT_0_007_CURRENT_058_NEXT_051_CONTINUITY=PASS"
          echo "NEXT_051_ACCEPTANCE_GATES_STILL_OPEN=TRUE"

      - name: Verify latest global current chain separately from overlay-pointer recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/behavior-hunter/tests -p 'test_verify_latest_current_0_0_chain.py' -v
          python3 scripts/behavior-hunter/verify_latest_current_0_0_chain.py

      - name: Test live CURRENT pointer discovery and preserve ambiguity as an explicit gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/behavior-hunter/tests -p 'test_discover_current_0_0_pointer.py' -v
          set +e
          python3 scripts/behavior-hunter/discover_current_0_0_pointer.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            status=$(python3 -c "import json; print(json.load(open('audit-output/current-pointer-discovery.json', encoding='utf-8'))['status'])")
            if [ "$status" = "AMBIGUOUS" ]; then
              echo "LIVE_CURRENT_POINTER=AMBIGUOUS_BLOCKED"
              echo "CURRENT_065_CURRENT_066_CONFLICT_REMAINS_OPEN=true"
            else
              echo "LIVE_CURRENT_POINTER_DISCOVERY=BLOCKED"
              exit 2
            fi
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            status=$(python3 -c "import json; print(json.load(open('audit-output/current-pointer-discovery.json', encoding='utf-8'))['status'])")
            if [ "$status" = "SCOPED_CONSISTENT" ]; then
              echo "LIVE_CURRENT_POINTER=SCOPED_CONSISTENT"
              echo "OVERLAY_RECOVERY_AND_GLOBAL_PROJECT_POINTERS_ARE_SEPARATELY_CONSISTENT=true"
            else
              echo "LIVE_CURRENT_POINTER=CONSISTENT"
            fi
          fi
          echo "No current pointer is promoted by this checker; source adjudication remains a separate decision."

      - name: Run structural and link audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "Audit name: Living Architecture Audit"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Runner UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit timestamp is not the original user-message timestamp."
            python3 scripts/audit_living_architecture.py
          } | tee audit-output/living-architecture-audit.txt

      - name: Run historical 0.0 graph content audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_historical_0_0_graph.py | tee audit-output/historical-0.0-graph-audit-run.txt

      - name: Run repository-wide timestamp inventory audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_timestamps.py | tee audit-output/timestamp-audit-run.txt

      - name: Test source-hash-verified semantic role decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_semantic_role_decisions.py -v
          python3 -m unittest discover -s tests -p test_parent_edge_resolution.py -v
          python3 -m unittest discover -s tests -p test_graph_identifier_roles.py -v

      - name: Build canonical historical graph manifest and validate edges
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_historical_graph_manifest.py

      - name: Run semantic UTC and Tehran timestamp pair audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_timestamp_pairs_semantic.py | tee audit-output/timestamp-pairs-semantic-audit-run.txt

      - name: Compile timestamp audit and host adapter tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_timestamp_pairs_semantic.py scripts/host_adapter.py scripts/host_adapter_github_worker.py scripts/test_host_adapter.py scripts/semantic_role_decisions.py scripts/build_historical_graph_manifest.py scripts/parent_edge_resolution.py scripts/graph_identifier_roles.py tests/test_parent_edge_resolution.py tests/test_graph_identifier_roles.py

      - name: Test durable host adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_host_adapter.py | tee audit-output/host-adapter-test-run.txt

      - name: Test portable HAIF GPT-host starter engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s prototype/haif-gpt6-starter -p 'test_engine.py' -v 2>&1 | tee audit-output/haif-gpt6-starter-tests.txt
          python3 -m py_compile prototype/haif-gpt6-starter/engine.py
          python3 -m json.tool prototype/haif-gpt6-starter/manifest.json >/dev/null
          python3 -m json.tool prototype/haif-gpt6-starter/state.schema.json >/dev/null
          echo "HAIF_GPT6_STARTER_ENGINE_TESTS=PASS"
          mkdir -p audit-output
          echo "CANONICAL_ZIP_BUILD_AND_DIGEST_ARE_PRODUCED_BY_PORTABLE_CONFORMANCE_WORKFLOW" 
          echo "This audit validates source/tests only; it does not emit a second archive with potentially different bytes."

      - name: Upload inspectable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-architecture-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 90
