name: Living Architecture Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-architecture-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v5

      - name: Enforce automatic interaction registration contract links
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/architecture/GOVERNANCE/AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001.md
          test -f docs/architecture/BEHAVIOR-TRACE/EVT-0073-AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/architecture/GOVERNANCE/ASSISTANT-TIMESTAMP-ANCHOR-STANDARD-2026-10-21-001.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/reference/REFERENCE-DOCUMENTS/PERMANENT-INTERACTION-ANCHORING-TIMESTAMP-GOVERNANCE-AND-CANONICAL-GRAPH-MASTER-REFERENCE-2026-10-21-001.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/REFERENCE_INDEX.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' docs/architecture/INTEGRATION-QUEUE/README.md
          grep -q 'AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001' 'docs/architecture/مدل اولیه AI/سند مرجع مادر مدل اولیه هوش مصنوعی.md'
          grep -q 'OPEN / NOT PROVEN' docs/architecture/GOVERNANCE/AUTOMATIC-INTERACTION-REGISTRATION-CONTRACT-2026-10-21-001.md
          echo "AUTOMATIC_INTERACTION_REGISTRATION_POLICY=PASS"
          echo "LIVE_MESSAGE_CAPTURE=OPEN_NOT_PROVEN"
          echo "Note: this gate checks repository policy integration only; it does not capture live ChatGPT messages."

      - name: Run structural and link audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "Audit name: Living Architecture Audit"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Runner UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit timestamp is not the original user-message timestamp."
            python3 scripts/audit_living_architecture.py
          } | tee audit-output/living-architecture-audit.txt

      - name: Run historical 0.0 graph content audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_historical_0_0_graph.py | tee audit-output/historical-0.0-graph-audit-run.txt

      - name: Run repository-wide timestamp inventory audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_timestamps.py | tee audit-output/timestamp-audit-run.txt

      - name: Build canonical historical graph manifest and validate edges
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_historical_graph_manifest.py

      - name: Upload inspectable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-architecture-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 90
